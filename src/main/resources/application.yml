server:
  port: ${PORT:8081}
  # Al detener o actualizar un contenedor, termina las peticiones en curso antes de apagarse.
  shutdown: graceful

spring:
  application:
    name: ms-autenticacion
  config:
    # En Docker Swarm los secretos (DB_PASSWORD, JWT_SECRET, WEBHOOK_API_KEY) llegan como archivos en
    # /run/secrets. configtree los carga como propiedades con el nombre del archivo; si la carpeta no
    # existe (por ejemplo al correr en local) se ignora.
    import: optional:configtree:/run/secrets/
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    # Base de datos propia del microservicio (database-per-service).
    # Los valores por defecto apuntan a un PostgreSQL local; se cambian con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bodeganube_auth}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      # Hibernate crea o actualiza las tablas a partir de las entidades al iniciar.
      ddl-auto: update
    # La sesion de BD se cierra al terminar la transaccion del service, no al final de la peticion HTTP.
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  jwt:
    # Clave para firmar los JWT (HMAC, minimo 32 caracteres). Se define con la variable de entorno JWT_SECRET;
    # el valor por defecto es solo para desarrollo local y no debe usarse en un ambiente real.
    secret: ${JWT_SECRET:cambiar-esta-clave-secreta-por-una-de-al-menos-32-caracteres}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

management:
  endpoints:
    web:
      exposure:
        # Solo se expone la salud. /actuator/health/liveness la usa el HEALTHCHECK de la imagen y
        # /actuator/health (incluye la base de datos) la consulta el pipeline despues de desplegar.
        include: health
  endpoint:
    health:
      probes:
        enabled: true
